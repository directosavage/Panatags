<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="panatagBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#panatagBg)" />
  
  <!-- Outer subtle radar circles -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="3" />
  
  <!-- Shield outline -->
  <path d="M 256,96 L 372,148 C 372,254 322,342 256,384 C 190,342 140,254 140,148 Z" 
        fill="url(#shieldGrad)" filter="url(#shadow)" />

  <!-- Filipino Sun / 3 Stars subtle theme inside shield -->
  <path d="M 256,128 L 344,170 C 344,250 306,318 256,352 C 206,318 168,250 168,170 Z" 
        fill="#0284c7" />

  <!-- Emergency Lifebuoy / Signal Beacon Heart -->
  <!-- Cross / Pulse Beacon in Gold -->
  <circle cx="256" cy="235" r="42" fill="#f59e0b" />
  <path d="M 256,205 L 256,265 M 226,235 L 286,235" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />

  <!-- Waves / Signal Rings -->
  <path d="M 200,295 Q 256,325 312,295" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  <path d="M 218,315 Q 256,335 294,315" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.8" />

  <!-- Tag text PANATAG badge -->
  <rect x="156" y="415" width="200" height="38" rx="19" fill="#1e293b" />
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="19" fill="#f8fafc" text-anchor="middle" letter-spacing="3">PANATAG</text>
</svg>